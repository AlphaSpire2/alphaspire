[package]
name = "alphaspire"
description = "Search and self-play companion to sts2sim: coverage fuzzing and belief analysis"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/AlphaSpire2/alphaspire"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
tract-onnx = "0.22.4"
# The simulator. A checkout that develops the two together patches this
# source with a sibling checkout in its own `.cargo/config.toml`.
sts2-core = { git = "https://github.com/AlphaSpire2/sts2sim", rev = "344dc9e6b28b60159fe8848c0f8ff1b943716697" }
sts2-engine = { git = "https://github.com/AlphaSpire2/sts2sim", rev = "344dc9e6b28b60159fe8848c0f8ff1b943716697" }
sts2-content = { git = "https://github.com/AlphaSpire2/sts2sim", rev = "344dc9e6b28b60159fe8848c0f8ff1b943716697" }
sts2-rng = { git = "https://github.com/AlphaSpire2/sts2sim", rev = "344dc9e6b28b60159fe8848c0f8ff1b943716697" }
sts2-replay = { git = "https://github.com/AlphaSpire2/sts2sim", rev = "344dc9e6b28b60159fe8848c0f8ff1b943716697" }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Strip symbols in distribution builds.
[profile.dist]
inherits = "release"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
